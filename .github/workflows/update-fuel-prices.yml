name: Update fuel prices

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch official EPPO prices
        run: node tools/update-fuel-prices.mjs
      - name: Publish updated prices
        run: |
          if git diff --quiet -- fuel-prices.json; then
            echo "EPPO prices have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel-prices.json
          git commit -m "Update official fuel prices"
          git push
